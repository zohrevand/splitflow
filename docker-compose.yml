services:
  db:
    image: postgres:16-alpine
    container_name: splitflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: splitflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d splitflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: splitflow-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:secretpassword@db:5432/splitflow?sslmode=disable"
      JWT_SECRET: "dev-super-secret-key-change-in-prod"
    ports:
      - "8080:8080"

volumes:
  postgres_data: